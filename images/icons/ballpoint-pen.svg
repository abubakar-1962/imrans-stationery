<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f4f3ef" rx="12"/>
  <g transform="translate(100, 100) rotate(45) translate(-100, -100)" stroke="#2b2b2b" stroke-width="3">
    <!-- Clicker -->
    <rect x="92" y="25" width="16" height="15" rx="3" fill="#c2694f"/>
    
    <!-- Pen Body -->
    <rect x="85" y="40" width="30" height="90" rx="4" fill="#52667a"/>
    
    <!-- Pocket Clip -->
    <rect x="115" y="55" width="8" height="35" rx="4" fill="#d0d4d8"/>
    <line x1="115" y1="60" x2="85" y2="60" stroke-width="3"/> <!-- Clip band -->

    <!-- Metal Cone Tip -->
    <polygon points="85,130 115,130 105,155 95,155" fill="#d0d4d8"/>
    
    <!-- Pen Nib / Ballpoint -->
    <polygon points="95,155 105,155 100,165" fill="#2b2b2b" stroke="none"/>
  </g>
</svg>
