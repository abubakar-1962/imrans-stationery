<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f4f3ef" rx="12"/>
  <g stroke="#2b2b2b" stroke-width="3">
    <!-- Main Box -->
    <rect x="40" y="60" width="120" height="80" rx="6" fill="#4a6984"/>
    <rect x="50" y="70" width="100" height="60" rx="2" fill="#5a7994" stroke="none"/>
    
    <!-- Ruler icon inside to make it look like a geometry box -->
    <rect x="60" y="85" width="60" height="14" fill="#f4f3ef" stroke-width="2"/>
    <line x1="68" y1="85" x2="68" y2="92" stroke-width="2"/>
    <line x1="76" y1="85" x2="76" y2="89" stroke-width="2"/>
    <line x1="84" y1="85" x2="84" y2="92" stroke-width="2"/>
    <line x1="92" y1="85" x2="92" y2="89" stroke-width="2"/>
    <line x1="100" y1="85" x2="100" y2="92" stroke-width="2"/>
    <line x1="108" y1="85" x2="108" y2="89" stroke-width="2"/>
  </g>
</svg>
