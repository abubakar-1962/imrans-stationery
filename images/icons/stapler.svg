<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f4f3ef" rx="12"/>
  <g stroke="#2b2b2b" stroke-width="3">
    <!-- Neck -->
    <path d="M 115 135 C 125 110, 135 110, 150 110 L 160 110 L 160 135 Z" fill="#c9a227"/>
    
    <!-- Top Arm (angled up to be open) -->
    <!-- Positive rotation goes clockwise in SVG, which tilts the left side UP -->
    <g transform="rotate(15 150 110)">
      <!-- Metal magazine with small cutout -->
      <path d="M 35 95 L 150 95 L 150 110 L 55 110 C 55 100, 45 100, 45 110 L 35 110 Z" fill="#d0d4d8"/>
      <!-- Top cover -->
      <path d="M 25 95 L 150 95 C 165 95, 165 60, 150 60 L 50 60 C 30 60, 25 80, 25 95 Z" fill="#3f7a7d"/>
    </g>
    
    <!-- Base -->
    <rect x="25" y="150" width="145" height="12" rx="4" fill="#52667a"/>
    <rect x="25" y="135" width="145" height="15" rx="4" fill="#c9a227"/>
    
    <!-- Anvil -->
    <rect x="35" y="125" width="25" height="10" rx="3" fill="#d0d4d8"/>
    
    <!-- Pivot -->
    <circle cx="150" cy="110" r="14" fill="#c9a227"/>
    <circle cx="150" cy="110" r="6" fill="#f4f3ef"/>
  </g>
</svg>
