<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f4f0" rx="10"/>
  <!-- Box body -->
  <rect x="30" y="60" width="140" height="100" rx="8" fill="#3b82f6"/>
  <rect x="30" y="60" width="140" height="16" rx="8" fill="#2563eb"/>
  <!-- Compass inside -->
  <line x1="100" y1="85" x2="80" y2="140" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="85" x2="120" y2="140" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="83" r="5" fill="#f5a623"/>
  <!-- Ruler -->
  <rect x="50" y="100" width="100" height="12" rx="2" fill="rgba(255,255,255,.3)"/>
  <!-- Label -->
  <text x="100" y="55" text-anchor="middle" font-size="12" fill="#3b82f6" font-family="sans-serif" font-weight="bold">GEOMETRY SET</text>
  <!-- Triangle outline -->
  <polygon points="60,145 100,105 140,145" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
</svg>
