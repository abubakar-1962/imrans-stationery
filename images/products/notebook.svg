<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f4f0" rx="10"/>
  <!-- Notebook body -->
  <rect x="45" y="30" width="120" height="145" rx="6" fill="#1a6b3c"/>
  <!-- Pages on the right -->
  <rect x="50" y="35" width="110" height="135" rx="4" fill="#fff"/>
  <!-- Spine -->
  <rect x="45" y="30" width="18" height="145" rx="6" fill="#134d2b"/>
  <!-- Spiral holes -->
  <circle cx="54" cy="55" r="4" fill="#f0f4f0"/>
  <circle cx="54" cy="75" r="4" fill="#f0f4f0"/>
  <circle cx="54" cy="95" r="4" fill="#f0f4f0"/>
  <circle cx="54" cy="115" r="4" fill="#f0f4f0"/>
  <circle cx="54" cy="135" r="4" fill="#f0f4f0"/>
  <circle cx="54" cy="155" r="4" fill="#f0f4f0"/>
  <!-- Lines on pages -->
  <line x1="75" y1="70" x2="155" y2="70" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="75" y1="85" x2="155" y2="85" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="75" y1="100" x2="155" y2="100" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="75" y1="115" x2="155" y2="115" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="75" y1="130" x2="155" y2="130" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="75" y1="145" x2="155" y2="145" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Label area -->
  <rect x="75" y="42" width="75" height="22" rx="3" fill="#f5a623"/>
  <text x="112" y="57" text-anchor="middle" font-size="10" fill="#fff" font-family="sans-serif" font-weight="bold">NOTEBOOK</text>
</svg>
