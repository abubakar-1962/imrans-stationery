<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f4f0" rx="10"/>
  <!-- Whiteboard background -->
  <rect x="20" y="30" width="160" height="100" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <!-- Writing on board -->
  <text x="100" y="90" text-anchor="middle" font-size="28" fill="#374151" font-family="sans-serif" font-weight="bold">ABC</text>
  <!-- Markers below -->
  <rect x="35" y="145" width="16" height="45" rx="4" fill="#ef4444"/>
  <rect x="60" y="145" width="16" height="45" rx="4" fill="#3b82f6"/>
  <rect x="85" y="145" width="16" height="45" rx="4" fill="#22c55e"/>
  <rect x="110" y="145" width="16" height="45" rx="4" fill="#000"/>
  <!-- Tips -->
  <rect x="35" y="185" width="16" height="8" rx="2" fill="#dc2626"/>
  <rect x="60" y="185" width="16" height="8" rx="2" fill="#1d4ed8"/>
  <rect x="85" y="185" width="16" height="8" rx="2" fill="#15803d"/>
  <rect x="110" y="185" width="16" height="8" rx="2" fill="#374151"/>
</svg>
